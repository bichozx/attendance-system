# Verifica el panel web: tipos, lint, compilación e imagen Docker.
# El panel vive en ./web dentro de este repositorio.
name: Web CI

on:
  push:
    branches: [master, main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm exec tsc --noEmit

      - name: Lint (sin advertencias)
        run: pnpm exec eslint src --max-warnings 0

      - name: Compilar
        run: pnpm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen del panel (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: asistencia-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
