services:
  postgres:
    image: postgres:17-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: attendance_dev
      TZ: UTC
    ports:
      # Puerto del PC → 5432 del contenedor. Debe coincidir con el de DATABASE_URL en backend/.env
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: